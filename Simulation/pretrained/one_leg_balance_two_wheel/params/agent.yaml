seed: 42
device: cuda:0
num_steps_per_env: 64
max_iterations: 1300
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: null
check_for_nan: true
save_interval: 50
experiment_name: one_leg_balance_two_wheel
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: RNNModel
  hidden_dims:
  - 32
  - 32
  activation: relu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.2
    std_type: log
  rnn_type: gru
  rnn_hidden_dim: 32
  rnn_num_layers: 1
critic:
  class_name: RNNModel
  hidden_dims:
  - 32
  - 32
  activation: relu
  obs_normalization: false
  distribution_cfg: null
  rnn_type: gru
  rnn_hidden_dim: 32
  rnn_num_layers: 1
algorithm:
  class_name: PPO
  num_learning_epochs: 4
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 0.5
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: true
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
